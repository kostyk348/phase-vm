[package]
name = "phase-vm"
version = "0.1.0"
edition = "2021"
description = "Phase-VM — обратимая регистровая машина (POC-1 обратимой парадигмы). Биективные инструкции с обратными, модель фазы/границы, reverse без логов."
license = "MIT"

[lib]
name = "phase_vm"
path = "src/lib.rs"

[[bin]]
name = "phase-vm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
